[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "friday-v5"
version = "0.1.0"
description = "Friday V5 — Claude Code engine, vault memory, local voice, terminal HUD"
requires-python = ">=3.12"
dependencies = [
    "claude-agent-sdk>=0.2.0",
    "rich>=13.0",
    # voice (all optional at runtime — the stack degrades gracefully)
    "numpy>=1.24",
    "sounddevice>=0.4",
]

[project.optional-dependencies]
voice = [
    "faster-whisper>=1.0",
    "piper-tts>=1.6",
    "onnxruntime>=1.16",
    "openwakeword>=0.4",
]
talk = ["keyboard"]
hud = ["textual>=0.80", "psutil>=5.9"]

[project.scripts]
friday5 = "friday_v5.cli:main"

[tool.setuptools.packages.find]
include = ["friday_v5*"]
